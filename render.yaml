services:
  - type: web
    name: victig-scrape-desk
    runtime: docker
    plan: starter            # always on: the scheduler lives in this process
    region: ohio
    healthCheckPath: /healthz
    disk:
      name: desk-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_TZ
        value: America/New_York
      - key: ALLOWED_DOMAIN
        value: victig.com
      - key: PB_ORG_ID
        value: "3152587389729387"
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard; never commit them.
      - key: PUBLIC_URL
        sync: false
      - key: PB_API_KEY
        sync: false
      - key: DESK_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BISON_KEY_VICTIG
        sync: false
      - key: HYPERTIDE_API_KEY
        sync: false
      - key: DESK_CHECK_TOKEN   # read by the Make daily check: GET /api/check with header X-Check-Token
        sync: false
